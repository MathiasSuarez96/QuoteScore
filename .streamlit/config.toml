[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 10
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0080FF"
backgroundColor = "#F3F8FF"
secondaryBackgroundColor = "#EDF4FC"
textColor = "#172B4D"
font = "sans serif"
